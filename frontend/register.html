<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | SMARTCLEAN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="CSS/style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">
        <div class="auth-logo">♻</div>
        <h2>SMART<span>CLEAN</span></h2>
        <p>Create your citizen account</p>
    </div>

    <div class="auth-card">

        <div class="text-center mb-4">
            <h3>Create Account</h3>
            <p class="text-muted mb-0">
                Join SMARTCLEAN and help build cleaner communities.
            </p>
        </div>

        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label">
                    Full Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Mobile Number
                    <span class="required">*</span>
                </label>

                <div class="input-group">
                    <span class="input-group-text">+91</span>

                    <input
                        type="tel"
                        id="registerMobile"
                        class="form-control"
                        maxlength="10"
                        placeholder="Enter 10-digit mobile number"
                        required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Email
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    class="form-control"
                    placeholder="example@email.com">
            </div>

            <button type="submit" class="btn btn-smart w-100">
                Continue with OTP Call →
            </button>

        </form>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <p class="text-center mb-0">
            Already have an account?<br>
            <a href="login.html">Login Here</a>
        </p>

    </div>

    <div class="text-center mt-4">
        <small class="text-muted">
            🌿 Together for a Cleaner & Smarter City
        </small>
    </div>

<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>

</body>
</html>
