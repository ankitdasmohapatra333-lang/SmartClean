<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | SMARTCLEAN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-container">
<div class="auth-brand">
<div class="auth-logo">♻</div>
<h2>SMART<span>CLEAN</span></h2>
<p>Intelligent Waste & Sanitation Management</p>
</div>
<div class="auth-card">
<div class="text-center mb-4">
<h3>Welcome Back</h3>
<p class="text-muted mb-0">Login using your mobile number</p>
</div>
<form id="loginForm">
<div class="mb-3">
<label class="form-label">Mobile Number <span class="required">*</span></label>
<div class="input-group">
<span class="input-group-text">+91</span>
<input type="tel" id="mobile" class="form-control" placeholder="Enter 10-digit mobile number" maxlength="10" required>
</div>
</div>
<div class="mb-4">
<label class="form-label">Email <span class="optional">(Optional)</span></label>
<input type="email" id="email" class="form-control" placeholder="example@email.com">
</div>
<button type="submit" class="btn btn-smart w-100">Get OTP Call <span>→</span></button>
</form>
<div class="auth-divider"><span>OR</span></div>
<p class="text-center mb-3">New to SMARTCLEAN?<br><a href="register.html">Create Account</a></p>
<div class="admin-link">
<a href="admin-login.html">🏛️ Municipality / Admin Login</a>
</div>
</div>
<div class="text-center mt-4">
<small class="text-muted">🌿 Building cleaner & smarter communities</small>
</div>
<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
