<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification | SMARTCLEAN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body class="auth-body">
<div class="auth-container">
<div class="auth-brand">
<div class="auth-logo">🔐</div>
<h2>SMART<span>CLEAN</span></h2>
<p>Secure Citizen Authentication</p>
</div>
<div class="auth-card text-center">
<div class="mb-3">
<div class="otp-security-icon">🛡️</div>
</div>
<h3>Verify OTP</h3>
<p class="text-muted mb-1">Enter the 6-digit code from the OTP call to</p>
<strong id="otpMobile" class="otp-mobile">+91 XXXXX XXXXX</strong>
<form id="otpForm">
<div class="otp-inputs">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="one-time-code">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric">
<input type="text" maxlength="1" class="otp-input" inputmode="numeric">
</div>
<button type="submit" class="btn btn-smart w-100 mt-4">✓ Verify OTP</button>
</form>
<div class="mt-4">
<span class="text-muted">Didn't receive the code?</span>
<button id="resendOtp" type="button" class="btn btn-link text-success fw-bold">Call Again</button>
</div>
<a href="login.html" class="back-link">← Back to Login</a>
</div>
<div class="text-center mt-4">
<small class="text-muted">🌿 Your secure gateway to a cleaner community</small>
</div>
<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
